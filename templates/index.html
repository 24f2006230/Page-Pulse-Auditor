<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Auditor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Page Pulse</h1>
        <div class="card shadow-sm p-4 mb-4">
            <form id="auditForm">
                <div class="mb-3">
                    <label for="urlInput" class="form-label">Enter URL to Audit</label>
                    <input type="text" class="form-control" id="urlInput" placeholder="https://example.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">Run Audit</button>
            </form>
        </div>
        <div id="resultsArea" class="mt-4" style="display: none;">
        </div>
    </div>
    <footer class="text-center mt-5 mb-3">
        <p class="text-muted text-sm">
            Built for Digital Heroes Training Task - 
            <a href="https://digitalheroesco.com" target="_blank">digitalheroesco.com</a>
        </p>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
